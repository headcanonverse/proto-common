syntax = "proto3";

package events;

option go_package = "github.com/headcanonverse/proto-common/events;events";

import "google/protobuf/timestamp.proto";

// Source идентифицирует клиентскую платформу, с которой пришло событие.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_WEB = 1;
  SOURCE_ANDROID = 2;
  SOURCE_IOS = 3;
  SOURCE_DESKTOP_WIN = 4;
  SOURCE_DESKTOP_MAC = 5;
  SOURCE_DESKTOP_LINUX = 6;
}

// ToggleStatus описывает двоичные события (добавлен/удален, подписался/отписался и т.д.).
enum ToggleStatus {
  TOGGLE_STATUS_UNSPECIFIED = 0;
  TOGGLE_STATUS_ENABLED = 1;
  TOGGLE_STATUS_DISABLED = 2;
}

// ReadingStatus фиксирует состояние чтения книги.
enum ReadingStatus {
  READING_STATUS_UNSPECIFIED = 0;
  READING_STATUS_READING = 1;
  READING_STATUS_PAUSED = 2;
  READING_STATUS_FINISHED = 3;
}

// BookFavoritedEvent публикуется при добавлении/удалении книги из избранного.
message BookFavoritedEvent {
  string event_id = 1;
  string user_id = 2;
  string work_id = 3;
  ToggleStatus status = 4;
  google.protobuf.Timestamp occurred_at = 5;
  Source source = 6;
}

// AuthorFollowedEvent публикуется при подписке на автора или отписке от него.
message AuthorFollowedEvent {
  string event_id = 1;
  string follower_id = 2;
  string author_id = 3;
  ToggleStatus status = 4;
  google.protobuf.Timestamp occurred_at = 5;
  Source source = 6;
}

// ReadingProgressUpdatedEvent описывает изменение прогресса чтения.
message ReadingProgressUpdatedEvent {
  string event_id = 1;
  string user_id = 2;
  string work_id = 3;
  int32 part = 4;
  double progress_percent = 5;
  ReadingStatus status = 6;
  google.protobuf.Timestamp occurred_at = 7;
  Source source = 8;
}

// EntityViewedEvent фиксирует факт просмотра сущности (книга, автор, плейлист).
// Публикуется под event_type: "book.opened", "author.opened", "playlist.opened".
message EntityViewedEvent {
  string event_id = 1;
  string user_id = 2;
  string kind = 3;       // "book" | "author" | "playlist"
  string external_id = 4;
  Source source = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

// BookFinishedEvent публикуется, когда пользователь завершил книгу.
message BookFinishedEvent {
  string event_id = 1;
  string user_id = 2;
  string work_id = 3;
  int32 last_part = 4;          // на какой части завершили (для сериалов).
  double progress_percent = 5;  // обычно 100, но оставили поле для гибкости.
  google.protobuf.Timestamp finished_at = 6;
  Source source = 7;
}

// ChapterReleasedEvent публикуется book-service при выходе новой главы/части.
message ChapterReleasedEvent {
  string event_id = 1;
  string work_id = 2;
  string chapter_id = 3;
  int32 chapter_number = 4;
  string title = 5;
  google.protobuf.Timestamp released_at = 6;
  // Абсолютное число глав work'а ПОСЛЕ события. Консюмеры (catalog-service)
  // выставляют parts_count/has_content присваиванием, а не инкрементом —
  // самоисцеление от пропущенных событий. 0 допустим; отсутствие поля в
  // старых событиях консюмер трактует как «нет данных» (-1).
  int32 parts_count = 7;
}

// ChapterDeletedEvent публикуется book-service при удалении главы.
// Едет в том же топике, что и ChapterReleasedEvent — тип различается
// kafka-header'ом `event_type` (из outbox.EventType).
message ChapterDeletedEvent {
  string event_id = 1;
  string work_id = 2;
  string chapter_id = 3;
  // Абсолютное число оставшихся глав ПОСЛЕ удаления (см. parts_count выше).
  int32 parts_count = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// BookReleasedEvent публикуется book-service при выпуске новой книги.
message BookReleasedEvent {
  string event_id = 1;
  string work_id = 2;
  string author_id = 3;
  string title = 4;
  google.protobuf.Timestamp released_at = 5;
  repeated LabelInfo labels = 6;
  repeated LabelInfo hidden_labels = 7;
  string synopsis = 8;
}

// BookMetaInfoUpdatedEvent публикуется при обновлении мета-информации книги.
message BookMetaInfoUpdatedEvent {
  string event_id = 1;
  string work_id = 2;
  string meta_info_id = 3;
  string title = 4;
  string synopsis = 5;
  repeated LabelInfo labels = 6;
  repeated LabelInfo hidden_labels = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp deleted_at = 10;
  double average_rating = 11;
  int32 parts_count = 12;
  int32 reviews_count = 13;
  int32 comments_count = 14;
}

// ReviewCreatedEvent captures creation of a new review on a book.
message ReviewCreatedEvent {
  string event_id = 1;
  string work_id = 2;
  string review_id = 3;
  string user_id = 4;
  int32 rating = 5;
  google.protobuf.Timestamp occurred_at = 6;
  map<string, string> metadata = 7;
}

// ReviewUpdatedEvent captures updates of an existing review.
message ReviewUpdatedEvent {
  string event_id = 1;
  string work_id = 2;
  string review_id = 3;
  string user_id = 4;
  int32 rating = 5;
  google.protobuf.Timestamp occurred_at = 6;
  map<string, string> metadata = 7;
}

// ReviewDeletedEvent captures soft deletion of a review.
message ReviewDeletedEvent {
  string event_id = 1;
  string work_id = 2;
  string review_id = 3;
  string user_id = 4;
  int32 rating = 5;
  google.protobuf.Timestamp occurred_at = 6;
  map<string, string> metadata = 7;
}

// CommentCreatedEvent captures creation of a new comment on a chapter.
message CommentCreatedEvent {
  string event_id = 1;
  string work_id = 2;
  string comment_id = 3;
  string user_id = 4;
  string book_part_id = 5;
  google.protobuf.Timestamp occurred_at = 6;
  map<string, string> metadata = 7;
}

// CommentDeletedEvent captures deletion of an existing comment.
message CommentDeletedEvent {
  string event_id = 1;
  string work_id = 2;
  string comment_id = 3;
  string user_id = 4;
  string book_part_id = 5;
  google.protobuf.Timestamp occurred_at = 6;
  map<string, string> metadata = 7;
}

// LabelType enumerates supported label taxonomies shared across services.
enum LabelType {
  LABEL_TYPE_UNSPECIFIED = 0;
  LABEL_TYPE_GENRE = 1;
  LABEL_TYPE_AGE_RATING = 2;
  LABEL_TYPE_STATUS = 3;
  LABEL_TYPE_LANGUAGE = 4;
  LABEL_TYPE_FORM = 5;
  LABEL_TYPE_USER_CREATED = 6;
}

// LabelInfo represents full label information in events.
message LabelInfo {
  string id = 1;
  int32 type = 2;
  string name = 3;
  string description = 4;
}

// PreferenceSelection describes a chosen label/type pair.
message PreferenceSelection {
  string label_name = 1;
  LabelType label_type = 2;
}

// UserPreferencesUpdatedEvent is emitted when a user updates their explicit preferences.
message UserPreferencesUpdatedEvent {
  string event_id = 1;
  string user_id = 2;
  repeated PreferenceSelection preferences = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// ============================================================================
// Recommendation Service Events
// ============================================================================

// RecommendationType defines the type of recommendation computed.
enum RecommendationType {
  RECOMMENDATION_TYPE_UNSPECIFIED = 0;
  RECOMMENDATION_TYPE_PERSONALIZED = 1;    // Персональные рекомендации (hybrid)
  RECOMMENDATION_TYPE_CONTENT_BASED = 2;   // На основе контента
  RECOMMENDATION_TYPE_COLLABORATIVE = 3;   // Collaborative filtering
  RECOMMENDATION_TYPE_TRENDING = 4;        // Trending/популярные
  RECOMMENDATION_TYPE_SIMILAR = 5;         // Похожие на книгу
  RECOMMENDATION_TYPE_COLD_START = 6;      // Для новых пользователей
}

// RecommendedWork represents a single book recommendation with score and reason.
message RecommendedWork {
  string work_id = 1;
  double score = 2;
  string reason = 3;                       // "because you liked X", "trending in genre Y"
}

// RecommendationsComputedEvent is published when recommendations are computed for a user.
message RecommendationsComputedEvent {
  string event_id = 1;
  string user_id = 2;
  RecommendationType recommendation_type = 3;
  repeated RecommendedWork works = 4;
  string algorithm = 5;                    // Algorithm version used
  google.protobuf.Timestamp computed_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // Stable logical identity of the computed shelf. Examples:
  // daily_mix:1, because_you_read:{work_id}, editorial:{slug},
  // discovery_for_you. Consumers must never infer this from `algorithm`.
  string shelf_key = 8;
}

// TrendingComputedEvent is published when global trending list is updated.
message TrendingComputedEvent {
  string event_id = 1;
  string period = 2;                       // daily/weekly/monthly
  repeated RecommendedWork works = 3;
  google.protobuf.Timestamp computed_at = 4;
}

// SimilarBooksComputedEvent is published when similar books for a book are computed.
message SimilarBooksComputedEvent {
  string event_id = 1;
  string work_id = 2;
  repeated RecommendedWork similar_works = 3;
  string algorithm = 4;
  google.protobuf.Timestamp computed_at = 5;
}

// ============================================================================
// Home Feed Service Events
// ============================================================================

// ShelfType defines the type of shelf on the home feed.
enum ShelfType {
  SHELF_TYPE_UNSPECIFIED = 0;
  SHELF_TYPE_CONTINUE_READING = 1;         // Продолжить чтение
  SHELF_TYPE_FOR_YOU = 2;                  // Для вас (персональные)
  SHELF_TYPE_TRENDING = 3;                 // Популярное сейчас
  SHELF_TYPE_NEW_FROM_AUTHORS = 4;         // Новое от авторов
  SHELF_TYPE_NEW_CHAPTERS = 5;             // Новые главы
  SHELF_TYPE_RECENTLY_ADDED = 6;           // Недавно добавленные
  SHELF_TYPE_BECAUSE_YOU_READ = 7;         // Потому что вы читали X
  SHELF_TYPE_TOP_RATED = 8;                // Лучшие по оценкам
}

// ShelfItem represents a single item in a shelf.
message ShelfItem {
  string work_id = 1;
  double score = 2;
  string reason = 3;
  map<string, string> metadata = 4;        // Additional display data
  google.protobuf.Timestamp added_at = 5;
}

// ShelfUpdatedEvent is published when a user's shelf is updated.
message ShelfUpdatedEvent {
  string event_id = 1;
  string user_id = 2;                      // Empty for global shelves
  ShelfType shelf_type = 3;
  repeated ShelfItem items = 4;
  int32 version = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ShelfInvalidatedEvent signals that a shelf needs to be rebuilt.
message ShelfInvalidatedEvent {
  string event_id = 1;
  string user_id = 2;                      // Empty for global shelves
  ShelfType shelf_type = 3;
  string reason = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// ============================================================================
// Search Service Events
// ============================================================================

// ProfileIndexedEvent is emitted by user-profile-service when a profile
// is created, updated, or deleted. If deleted_at is set, the profile
// must be removed from the search index.
message ProfileIndexedEvent {
  string event_id = 1;
  string user_id = 2;
  string nickname = 3;
  string about = 4;
  string avatar_thumb_url = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
}

// ============================================================================
// Catalog Service Events (discovery: works/editions, user-library, import)
// ============================================================================

// WorkSource определяет происхождение work в каталоге.
enum WorkSource {
  WORK_SOURCE_UNSPECIFIED = 0;
  WORK_SOURCE_OPENLIBRARY = 1;
  WORK_SOURCE_SAMIZDAT = 2;
  WORK_SOURCE_EXTERNAL = 3;
}

// UserWorkStatus — статус книги в библиотеке пользователя (user_works).
enum UserWorkStatus {
  USER_WORK_STATUS_UNSPECIFIED = 0;
  USER_WORK_STATUS_WANT_TO_READ = 1;
  USER_WORK_STATUS_READING = 2;
  USER_WORK_STATUS_READ = 3;
  USER_WORK_STATUS_DNF = 4;
}

// WorkUpsertedEvent публикуется catalog-service при создании/обновлении work.
// Консюмеры: recommendation-service (feature store), search-service (индекс works).
// Книжные события переведены на work_id (2026-07-17, фаза 2 реворка,
// единое ID-пространство — см. plan-book-discovery-implementation.md).
// book_part_id в comment-событиях остаётся: глава — сущность контент-домена.
//
// Событие содержит полный catalog metadata snapshot. metadata_version > 0,
// строго монотонна per work_id и общая с WorkPurgedEvent. Consumer атомарно
// заменяет только всю metadata half при большей version, считает равную version
// идемпотентной и игнорирует меньшую как stale. Producer не выпускает разные
// snapshots с одинаковой version; consumer вправе отклонить такой конфликт.
// Metadata update никогда не изменяет discovery half, принадлежащую
// WorkDiscoveryUpdatedEvent.
message WorkUpsertedEvent {
  string event_id = 1;
  string work_id = 2;
  WorkSource source = 3;
  string title = 4;
  repeated string authors = 5;
  // Display names only. Full typed label facts are carried by
  // metadata["label_projection_v1"].
  repeated string labels = 6;
  bool is_adult = 7;
  bool has_content = 8;                // есть главы в book-service
  bool published = 9;
  float average_rating = 10;
  google.protobuf.Timestamp occurred_at = 11;
  map<string, string> metadata = 12;
  // sha256(title|description|subjects|language) — хэш полей, из которых
  // строится обогащение. Каталог его только вычисляет; reco сравнивает с
  // хэшем последнего обогащения и сам решает, ставить ли work в очередь
  // пересчёта (рейтинговые мутации хэш не меняют → GPU не дёргается).
  string enrich_source_hash = 13;
  uint64 metadata_version = 14;
  string title_normalized = 15;
  string author_normalized = 16;
  // Full canonical ISBN-13 set across all editions, sorted and deduplicated.
  repeated string isbn13s = 17;
  string cover_url = 18;
  string language = 19;
  // Catalog-owned bibliographic fact. Zero means unknown. Consumers must not
  // substitute occurred_at or projection time when this value is absent.
  int32 first_publish_year = 20;
}

// WorkPurgedEvent публикуется catalog-service только после окончательного
// удаления work по истечении 30-дневного окна восстановления. Soft-delete
// продолжает использовать WorkUpsertedEvent{published=false}; это отдельное
// событие запускает идемпотентную физическую зачистку контентного домена.
// metadata_version > 0 и принадлежит той же строго монотонной per-work
// sequence, что и WorkUpsertedEvent. Это ordered hard tombstone: большая
// version удаляет metadata projection, равная идемпотентна, меньшая stale.
// Consumer сохраняет tombstone ordering watermark даже после удаления
// searchable document, чтобы старый WorkUpsertedEvent не мог воскресить work.
message WorkPurgedEvent {
  string event_id = 1;
  string work_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  map<string, string> metadata = 4;
  uint64 metadata_version = 5;
}

// WorkPublicationChangedEvent is the catalog-owned publication projection
// consumed by home-feed-service. It is deliberately separate from
// WorkUpsertedEvent: catalog metadata replay is allowed to republish every
// WorkUpsertedEvent and must never manufacture "new release" side effects.
//
// Catalog emits this complete snapshot for author-owned works whenever the
// emitted release facts change. first_published_at is stable across
// soft-delete/restore; published=false removes the work from release shelves.
// metadata_version belongs to the same per-work sequence as WorkUpsertedEvent
// and WorkPurgedEvent. Consumers apply only a greater version, treat an equal
// payload as idempotent, and ignore a lower stale version.
message WorkPublicationChangedEvent {
  string event_id = 1;
  string work_id = 2;
  bool published = 3;
  google.protobuf.Timestamp first_published_at = 4;
  string title = 5;
  repeated string authors = 6;
  repeated string labels = 7;
  google.protobuf.Timestamp occurred_at = 8;
  map<string, string> metadata = 9;
  uint64 metadata_version = 10;
}

// PlaylistSearchProjectionOperation defines the complete online search
// projection mutation emitted by catalog-service. There are no partial updates.
enum PlaylistSearchProjectionOperation {
  PLAYLIST_SEARCH_PROJECTION_OPERATION_UNSPECIFIED = 0;
  PLAYLIST_SEARCH_PROJECTION_OPERATION_UPSERT = 1;
  PLAYLIST_SEARCH_PROJECTION_OPERATION_DELETE = 2;
}

// PlaylistSearchProjectionV1Event is the catalog-owned full snapshot consumed
// only by search-service. Kafka messages are keyed by playlist_id.
//
// projection_version is positive and monotonically increasing per playlist.
// Equal versions are idempotent only for an identical snapshot; lower versions
// are stale. DELETE is an ordered tombstone. A private playlist uses DELETE
// with is_public=false/deleted=false; a deleted playlist additionally sets
// deleted=true. UPSERT requires is_public=true/deleted=false.
message PlaylistSearchProjectionV1Event {
  string event_id = 1;
  string playlist_id = 2;
  PlaylistSearchProjectionOperation operation = 3;
  string owner_user_id = 4;
  string title = 5;
  string description = 6;
  string cover_url = 7;
  int32 work_count = 8;
  repeated string author_user_ids = 9;
  bool is_public = 10;
  bool deleted = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp source_updated_at = 13;
  uint64 projection_version = 14;
}

// LibraryImportCompletedEvent публикуется по завершении импорта CSV
// (Goodreads/StoryGraph) библиотеки пользователя.
message LibraryImportCompletedEvent {
  string event_id = 1;
  string user_id = 2;
  string import_id = 3;
  int32 total = 4;
  int32 matched_auto = 5;
  int32 matched_low_confidence = 6;
  int32 unresolved = 7;
  google.protobuf.Timestamp occurred_at = 8;
  map<string, string> metadata = 9;
}


// UserWorkStatusChangedEvent публикуется при изменении статуса/оценки книги
// в библиотеке пользователя (user_works). Консюмер: recommendation-service.
message UserWorkStatusChangedEvent {
  string event_id = 1;
  string user_id = 2;
  string work_id = 3;
  UserWorkStatus status = 4;
  int32 rating = 5;                    // 1–5, 0 = не выставлена
  string dnf_reason = 6;               // опционально при status=DNF
  google.protobuf.Timestamp occurred_at = 7;
  map<string, string> metadata = 8;
}

// ============================================================================
// Recommendation -> Search Discovery Projection Events
// ============================================================================

// WorkDiscoveryTier is the authoritative eligibility tier derived by
// recommendation-service. The wire enum keeps UNSPECIFIED as an invalid
// sentinel; consumers map COLD/DISCOVERY/READABLE to domain tiers 0/1/2.
enum WorkDiscoveryTier {
  WORK_DISCOVERY_TIER_UNSPECIFIED = 0;
  WORK_DISCOVERY_TIER_COLD = 1;
  WORK_DISCOVERY_TIER_DISCOVERY = 2;
  WORK_DISCOVERY_TIER_READABLE = 3;
}

// WorkDiscoverySelectionStatus is an axis separate from tier. Readable works
// that do not participate in external selection use NOT_APPLICABLE.
enum WorkDiscoverySelectionStatus {
  WORK_DISCOVERY_SELECTION_STATUS_UNSPECIFIED = 0;
  WORK_DISCOVERY_SELECTION_STATUS_NOT_APPLICABLE = 1;
  WORK_DISCOVERY_SELECTION_STATUS_ACTIVE = 2;
  WORK_DISCOVERY_SELECTION_STATUS_GRACE = 3;
  WORK_DISCOVERY_SELECTION_STATUS_INACTIVE = 4;
  WORK_DISCOVERY_SELECTION_STATUS_BLOCKED = 5;
}

// WorkDiscoveryReason is a controlled explanation of the current derived
// state. Generated vibe tags and free-form metadata are intentionally absent.
enum WorkDiscoveryReason {
  WORK_DISCOVERY_REASON_UNSPECIFIED = 0;
  WORK_DISCOVERY_REASON_OL_TRENDING = 1;
  WORK_DISCOVERY_REASON_COMMERCE_HISTORY = 2;
  WORK_DISCOVERY_REASON_RECENT_RELEASE_ACTIVITY = 3;
  WORK_DISCOVERY_REASON_READING_LOG_RECENT = 4;
  WORK_DISCOVERY_REASON_ALL_TIME_ACTIVE_CLASSIC = 5;
  WORK_DISCOVERY_REASON_LANGUAGE_GENRE_QUOTA = 6;
  WORK_DISCOVERY_REASON_READABLE_CONTENT = 7;
  WORK_DISCOVERY_REASON_MANUAL_EDITORIAL = 8;
  WORK_DISCOVERY_REASON_GRACE_RETENTION = 9;
  WORK_DISCOVERY_REASON_OPERATOR_BLOCK = 10;
}

// WorkDiscoveryRankBucket is a policy-versioned ranking projection. Bucket
// boundaries belong to policy_version and are not part of this wire contract.
enum WorkDiscoveryRankBucket {
  WORK_DISCOVERY_RANK_BUCKET_UNSPECIFIED = 0;
  WORK_DISCOVERY_RANK_BUCKET_NOT_APPLICABLE = 1;
  WORK_DISCOVERY_RANK_BUCKET_TOP = 2;
  WORK_DISCOVERY_RANK_BUCKET_HIGH = 3;
  WORK_DISCOVERY_RANK_BUCKET_MEDIUM = 4;
  WORK_DISCOVERY_RANK_BUCKET_BASE = 5;
}

// WorkDiscoveryUpdatedEvent is emitted by recommendation-service through its
// transactional outbox. For removed=false, consumers atomically replace the
// complete tier + selection_status projection and related fields. This replaces
// only the discovery half and never changes catalog metadata fields.
//
// state_version is greater than zero and monotonically increasing per work_id.
// Consumers apply only a version greater than the stored one, treat an equal
// version as idempotent, and ignore lower stale versions. A producer never
// emits different snapshots at an equal version; consumers may reject such a
// conflict. removed=true is an ordered tombstone: it removes the discovery
// projection and the remaining state fields are ignored.
//
// source_metadata_version is greater than zero and identifies the exact catalog
// snapshot from which reco derived this state. Search exposes discovery
// eligibility only while it equals the current WorkUpsertedEvent.metadata_version.
// Either older or newer discovery metadata remains pending until the matching
// projection half arrives.
message WorkDiscoveryUpdatedEvent {
  string event_id = 1;
  string work_id = 2;
  WorkDiscoveryTier tier = 3;
  WorkDiscoverySelectionStatus selection_status = 4;
  repeated WorkDiscoveryReason reasons = 5;
  bool discovery_eligible = 6;
  WorkDiscoveryRankBucket rank_bucket = 7;
  string policy_version = 8;
  uint64 state_version = 9;
  google.protobuf.Timestamp occurred_at = 10;
  bool removed = 11;
  uint64 source_metadata_version = 12;
}
